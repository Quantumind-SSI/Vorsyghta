# ================================
# Vorsyghta - Complete Docker Stack
# ================================
# Migration-first local and self-hosted container deployment
# Services: PostgreSQL, Redis, Ollama, migration runner, API, web, Prometheus, Grafana

x-vorsyghta-api-image: &vorsyghta-api-image
  image: ${VORSYGHTA_API_IMAGE:-vorsyghta-api:local}
  build:
    context: .
    dockerfile: Dockerfile

services:
  # ================================
  # PostgreSQL Database
  # ================================
  postgres:
    image: postgres:16-alpine
    container_name: vorsyghta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vorsyghta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vorsyghta}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    networks:
      - vorsyghta-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vorsyghta}"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      com.vorsyghta.service: "database"
      com.vorsyghta.description: "PostgreSQL database for persistent storage"

  # ================================
  # Redis Cache
  # ================================
  redis:
    image: redis:7-alpine
    container_name: vorsyghta-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6380}:6379"
    networks:
      - vorsyghta-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    labels:
      com.vorsyghta.service: "cache"
      com.vorsyghta.description: "Redis for caching and session management"

  # ================================
  # Ollama - Local LLM Server
  # ================================
  ollama:
    image: ollama/ollama:latest
    container_name: vorsyghta-ollama
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    networks:
      - vorsyghta-network
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    healthcheck:
      # ollama/ollama image ships no curl/wget; use the bundled CLI instead
      test: ["CMD", "ollama", "ls"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      com.vorsyghta.service: "llm"
      com.vorsyghta.description: "Local LLM server with Ollama"
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G

  # ================================
  # Database Migration Runner
  # ================================
  migrate:
    <<: *vorsyghta-api-image
    container_name: vorsyghta-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-vorsyghta}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-vorsyghta}
    working_dir: /app
    command: ["python", "-m", "alembic", "upgrade", "head"]
    networks:
      - vorsyghta-network
    labels:
      com.vorsyghta.service: "migration"
      com.vorsyghta.description: "One-shot Alembic schema migration"
  # ================================
  # Django API Server
  # ================================
  vorsyghta-api:
    <<: *vorsyghta-api-image
    container_name: vorsyghta-api
    restart: unless-stopped
    user: "0:0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-vorsyghta}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-vorsyghta}
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_SETTINGS_MODULE=server.settings
      - DEBUG=false
      - VORSYGHTA_SECRET_KEY=${VORSYGHTA_SECRET_KEY}
      - SECURE_SSL_REDIRECT=false
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,vorsyghta-api,host.docker.internal
      - EMAIL_HOST=mailpit
      - EMAIL_PORT=1025
      - VORSYGHTA_BILLING_REQUIRED=false
    working_dir: /app
    command: ["bash", "-c", "python manage.py runserver 0.0.0.0:8000"]
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    networks:
      - vorsyghta-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ================================
  # Vorsyghta API Server - DISABLED: Django is now backend
  # ================================
  # vorsyghta-api:
  #   <<: *vorsyghta-api-image
  #   container_name: vorsyghta-api
  #   restart: unless-stopped
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   environment:
  #     # Database
  #     - DATABASE_URL=postgresql://${POSTGRES_USER:-vorsyghta}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-vorsyghta}
  #     ...
  #   ports:
  #     - "${API_PORT:-8001}:8000"
  #   networks:
  #     - vorsyghta-network
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
  # ================================
  # Vorsyghta Web Application
  # ================================
  vorsyghta-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vorsyghta-web
    restart: unless-stopped
    depends_on:
      vorsyghta-api:
        condition: service_started
    environment:
      - VORSYGHTA_API_URL=http://vorsyghta-api:8000
      - VORSYGHTA_ALLOW_INSECURE_INTERNAL_API=true
    ports:
      - "${WEB_PORT:-3002}:3000"
    networks:
      - vorsyghta-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      com.vorsyghta.service: "web"
      com.vorsyghta.description: "Vorsyghta public site and application"

  # ================================
  # Prometheus - Metrics Collection
  # ================================
  prometheus:
    image: prom/prometheus:latest
    container_name: vorsyghta-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    networks:
      - vorsyghta-network
    depends_on:
      - vorsyghta-api
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      com.vorsyghta.service: "monitoring"
      com.vorsyghta.description: "Prometheus metrics collection"

  # ================================
  # Grafana - Metrics Visualization
  # ================================
  grafana:
    image: grafana/grafana:latest
    container_name: vorsyghta-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3001}
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    networks:
      - vorsyghta-network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      com.vorsyghta.service: "monitoring"
      com.vorsyghta.description: "Grafana metrics dashboard"

  # ================================
  # PgAdmin - Database Management (Optional)
  # ================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: vorsyghta-pgadmin
    restart: unless-stopped
    depends_on:
      - postgres
      - vorsyghta-api
    environment:
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    networks:
      - vorsyghta-network
    profiles:
      - tools
    labels:
      com.vorsyghta.service: "tools"
      com.vorsyghta.description: "PgAdmin database management interface"

  # ================================
  # Mailpit - Email Testing
  # ================================
  mailpit:
    image: axllent/mailpit:latest
    container_name: vorsyghta-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"
    networks:
      - vorsyghta-network
    labels:
      com.vorsyghta.service: "mail"
      com.vorsyghta.description: "Mailpit SMTP testing and web UI"

# ================================
# Networks
# ================================
networks:
  vorsyghta-network:
    driver: bridge
    name: vorsyghta-network
    labels:
      com.vorsyghta.network: "main"

# ================================
# Volumes
# ================================
volumes:
  postgres_data:
    name: vorsyghta-postgres-data
    labels:
      com.vorsyghta.volume: "database"
  
  redis_data:
    name: vorsyghta-redis-data
    labels:
      com.vorsyghta.volume: "cache"
  
  ollama_models:
    name: vorsyghta-ollama-models
    labels:
      com.vorsyghta.volume: "models"
  
  prometheus_data:
    name: vorsyghta-prometheus-data
    labels:
      com.vorsyghta.volume: "metrics"
  
  grafana_data:
    name: vorsyghta-grafana-data
    labels:
      com.vorsyghta.volume: "dashboards"
  
  pgadmin_data:
    name: vorsyghta-pgadmin-data
    labels:
      com.vorsyghta.volume: "tools"
