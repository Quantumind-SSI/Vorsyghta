# ================================
# Vorsyghta - Complete Docker Stack
# ================================
# Migration-first local and self-hosted container deployment
# Services: PostgreSQL, Redis, Ollama, migration runner, API, web, Prometheus, Grafana

x-vorsyghta-api-image: &vorsyghta-api-image
  image: ${VORSYGHTA_API_IMAGE:-vorsyghta-api:local}
  build:
    context: .
    dockerfile: Dockerfile

services:
  # ================================
  # PostgreSQL Database
  # ================================
  postgres:
    image: postgres:16-alpine
    container_name: vorsyghta-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vorsyghta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-vorsyghta}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    networks:
      - vorsyghta-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vorsyghta}"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      com.vorsyghta.service: "database"
      com.vorsyghta.description: "PostgreSQL database for persistent storage"

  # ================================
  # Redis Cache
  # ================================
  redis:
    image: redis:7-alpine
    container_name: vorsyghta-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6380}:6379"
    networks:
      - vorsyghta-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    labels:
      com.vorsyghta.service: "cache"
      com.vorsyghta.description: "Redis for caching and session management"

  # ================================
  # Ollama - Local LLM Server
  # ================================
  ollama:
    image: ollama/ollama:latest
    container_name: vorsyghta-ollama
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    networks:
      - vorsyghta-network
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      com.vorsyghta.service: "llm"
      com.vorsyghta.description: "Local LLM server with Ollama"
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G

  # ================================
  # Database Migration Runner
  # ================================
  migrate:
    <<: *vorsyghta-api-image
    container_name: vorsyghta-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-vorsyghta}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-vorsyghta}
    working_dir: /app
    command: ["python", "-m", "alembic", "upgrade", "head"]
    networks:
      - vorsyghta-network
    labels:
      com.vorsyghta.service: "migration"
      com.vorsyghta.description: "One-shot Alembic schema migration"

  # ================================
  # Vorsyghta API Server
  # ================================
  vorsyghta-api:
    <<: *vorsyghta-api-image
    container_name: vorsyghta-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    environment:
      # Database
      - DATABASE_URL=postgresql://${POSTGRES_USER:-vorsyghta}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-vorsyghta}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-20}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-30}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-30}
      - DB_POOL_RECYCLE=${DB_POOL_RECYCLE:-3600}
      # Redis
      - REDIS_URL=redis://redis:6379/0
      # LLM Providers
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OLLAMA_BASE_URL=http://ollama:11434
      - DEFAULT_LLM_PROVIDER=${DEFAULT_LLM_PROVIDER:-openrouter}
      # Application
      - VORSYGHTA_SECRET_KEY=${VORSYGHTA_SECRET_KEY:?Set VORSYGHTA_SECRET_KEY in .env}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DEBUG=${DEBUG:-false}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      # Stripe Billing (explicitly required for SaaS or disabled for self-hosted use)
      - VORSYGHTA_BILLING_REQUIRED=${VORSYGHTA_BILLING_REQUIRED:?Set VORSYGHTA_BILLING_REQUIRED in .env}
      - STRIPE_EXPECTED_LIVEMODE=${STRIPE_EXPECTED_LIVEMODE:?Set STRIPE_EXPECTED_LIVEMODE in .env}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - STRIPE_PRICE_ID=${STRIPE_PRICE_ID:-}
      - STRIPE_CHECKOUT_SUCCESS_URL=${STRIPE_CHECKOUT_SUCCESS_URL:-http://localhost:${WEB_PORT:-3002}/start-trial?checkout=success}
      - STRIPE_CHECKOUT_CANCEL_URL=${STRIPE_CHECKOUT_CANCEL_URL:-http://localhost:${WEB_PORT:-3002}/start-trial?checkout=canceled}
      - STRIPE_PORTAL_RETURN_URL=${STRIPE_PORTAL_RETURN_URL:-http://localhost:${WEB_PORT:-3002}/app/settings/billing}
      - STRIPE_AUTOMATIC_TAX_ENABLED=${STRIPE_AUTOMATIC_TAX_ENABLED:-true}
      - STRIPE_TAX_ID_COLLECTION_ENABLED=${STRIPE_TAX_ID_COLLECTION_ENABLED:-true}
      - STRIPE_REQUEST_TIMEOUT_SECONDS=${STRIPE_REQUEST_TIMEOUT_SECONDS:-10}
      - STRIPE_MAX_NETWORK_RETRIES=${STRIPE_MAX_NETWORK_RETRIES:-2}
      - STRIPE_WEBHOOK_TOLERANCE_SECONDS=${STRIPE_WEBHOOK_TOLERANCE_SECONDS:-300}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:${WEB_PORT:-3002}}
      # Python
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./vorsyghta:/app/vorsyghta:ro
      - ./templates:/app/templates:ro
      - ./data:/app/data
      - ./logs:/app/logs
      - ./generated_content:/app/generated_content
      - ./reports:/app/reports
    ports:
      - "${API_PORT:-8001}:8000"
    networks:
      - vorsyghta-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      com.vorsyghta.service: "api"
      com.vorsyghta.description: "Vorsyghta main API server"

  # ================================
  # Vorsyghta Web Application
  # ================================
  vorsyghta-web:
    profiles:
      - web
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vorsyghta-web
    restart: unless-stopped
    depends_on:
      vorsyghta-api:
        condition: service_healthy
    environment:
      - VORSYGHTA_API_URL=http://vorsyghta-api:8000
      - VORSYGHTA_ALLOW_INSECURE_INTERNAL_API=true
    ports:
      - "${WEB_PORT:-3002}:3000"
    networks:
      - vorsyghta-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      com.vorsyghta.service: "web"
      com.vorsyghta.description: "Vorsyghta public site and application"

  # ================================
  # Prometheus - Metrics Collection
  # ================================
  prometheus:
    image: prom/prometheus:latest
    container_name: vorsyghta-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    networks:
      - vorsyghta-network
    depends_on:
      - vorsyghta-api
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      com.vorsyghta.service: "monitoring"
      com.vorsyghta.description: "Prometheus metrics collection"

  # ================================
  # Grafana - Metrics Visualization
  # ================================
  grafana:
    image: grafana/grafana:latest
    container_name: vorsyghta-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3001}
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    networks:
      - vorsyghta-network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      com.vorsyghta.service: "monitoring"
      com.vorsyghta.description: "Grafana metrics dashboard"

  # ================================
  # PgAdmin - Database Management (Optional)
  # ================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: vorsyghta-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@vorsyghta.local
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD in .env}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    networks:
      - vorsyghta-network
    depends_on:
      - postgres
    profiles:
      - tools
    labels:
      com.vorsyghta.service: "tools"
      com.vorsyghta.description: "PgAdmin database management interface"

# ================================
# Networks
# ================================
networks:
  vorsyghta-network:
    driver: bridge
    name: vorsyghta-network
    labels:
      com.vorsyghta.network: "main"

# ================================
# Volumes
# ================================
volumes:
  postgres_data:
    name: vorsyghta-postgres-data
    labels:
      com.vorsyghta.volume: "database"
  
  redis_data:
    name: vorsyghta-redis-data
    labels:
      com.vorsyghta.volume: "cache"
  
  ollama_models:
    name: vorsyghta-ollama-models
    labels:
      com.vorsyghta.volume: "models"
  
  prometheus_data:
    name: vorsyghta-prometheus-data
    labels:
      com.vorsyghta.volume: "metrics"
  
  grafana_data:
    name: vorsyghta-grafana-data
    labels:
      com.vorsyghta.volume: "dashboards"
  
  pgadmin_data:
    name: vorsyghta-pgadmin-data
    labels:
      com.vorsyghta.volume: "tools"
