# ZestPayment Vorsyghta Deployment - Kubernetes Manifests
# Target: Huawei Cloud CCE (Cloud Container Engine)
# Namespace: vorsyghta

---
apiVersion: v1
kind: Namespace
metadata:
  name: vorsyghta
  labels:
    app.kubernetes.io/name: vorsyghta
    environment: production
    compliance: pci-dss

---
# ConfigMap for non-secret configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: vorsyghta-config
  namespace: vorsyghta
data:
  VORSYGHTA_ENV: "production"
  VORSYGHTA_LOG_LEVEL: "INFO"
  VORSYGHTA_LOG_FORMAT: "json"
  VORSYGHTA_API_HOST: "0.0.0.0"
  VORSYGHTA_API_PORT: "8000"
  VORSYGHTA_METRICS_ENABLED: "true"
  VORSYGHTA_METRICS_ENDPOINT: "/metrics"
  VORSYGHTA_PCI_DSS_MODE: "true"
  VORSYGHTA_DATA_RESIDENCY: "ng"
  VORSYGHTA_REDACT_PII: "true"
  VORSYGHTA_REDACT_PAN: "true"
  OLLAMA_BASE_URL: "http://ollama-service:11434"
  OLLAMA_MODEL: "llama3:70b"

---
# Secret for LLM and integration credentials (use Huawei DEW in production)
apiVersion: v1
kind: Secret
metadata:
  name: vorsyghta-secrets
  namespace: vorsyghta
  labels:
    app.kubernetes.io/name: vorsyghta
type: Opaque
stringData:
  # LLM API keys (populate via Huawei DEW or kubectl create secret)
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  HUAWEI_MODELARTS_API_KEY: ""
  HUAWEI_MODELARTS_ENDPOINT: ""
  INTERNAL_GATEWAY_URL: ""
  INTERNAL_GATEWAY_TOKEN: ""
  # Microsoft 365 / Entra ID
  M365_TENANT_ID: ""
  M365_CLIENT_ID: ""
  M365_CLIENT_SECRET: ""
  # Database
  DB_HOST: ""
  DB_USER: ""
  DB_PASSWORD: ""
  # JWT
  JWT_SECRET_KEY: ""
  # Huawei Cloud services
  HUAWEI_LTS_ENDPOINT: ""
  HUAWEI_LTS_GROUP_ID: ""
  HUAWEI_LTS_STREAM_ID: ""
  DEW_KMS_KEY_ID: ""
  SWR_ENDPOINT: ""
  # SMTP (if using SMTP relay)
  SMTP_HOST: ""
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""

---
# Persistent Volume Claim for data storage
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vorsyghta-data
  namespace: vorsyghta
  labels:
    app.kubernetes.io/name: vorsyghta
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: huawei-evs-ssd

---
# Persistent Volume Claim for datasets
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vorsyghta-datasets
  namespace: vorsyghta
  labels:
    app.kubernetes.io/name: vorsyghta
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 50Gi
  storageClassName: huawei-sfs-turbo

---
# Vorsyghta API Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vorsyghta-api
  namespace: vorsyghta
  labels:
    app.kubernetes.io/name: vorsyghta
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: vorsyghta
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vorsyghta
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: vorsyghta-api
          image: swr.ng-west-1.myhuaweicloud.com/vorsyghta/vorsyghta:latest
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: vorsyghta-config
            - secretRef:
                name: vorsyghta-secrets
          volumeMounts:
            - name: data
              mountPath: /data
            - name: datasets
              mountPath: /datasets
            - name: config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
          resources:
            requests:
              cpu: "2000m"
              memory: "4Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vorsyghta-data
        - name: datasets
          persistentVolumeClaim:
            claimName: vorsyghta-datasets
        - name: config
          configMap:
            name: vorsyghta-config-file
      imagePullSecrets:
        - name: swr-credentials

---
# ConfigMap for the actual config.yaml file
apiVersion: v1
kind: ConfigMap
metadata:
  name: vorsyghta-config-file
  namespace: vorsyghta
data:
  config.yaml: |
    # Inline config.yaml content - mounted to /app/config.yaml
    # Use the full config from deployments/zestpayment/config.yaml
    simulation:
      default_threat_type: "payment_fraud"
      max_concurrent_simulations: 5
      pci_dss_mode: true
      data_residency: "ng"
      redact_pii: true
      redact_pan: true
    llm:
      providers:
        - name: "ollama_local"
          type: "ollama"
          enabled: true
          base_url: "http://ollama-service:11434"
          model: "llama3:70b"
          priority: 1
    safety:
      enabled: true
      strict_mode: true
      pci_dss_compliance: true
      audit_all_actions: true

---
# Ollama GPU Deployment for local LLM hosting
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: vorsyghta
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/component: llm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
              name: http
              protocol: TCP
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "2"
            - name: OLLAMA_NUM_PARALLEL
              value: "4"
          resources:
            requests:
              cpu: "2000m"
              memory: "8Gi"
              nvidia.com/gpu: 1
            limits:
              cpu: "4000m"
              memory: "16Gi"
              nvidia.com/gpu: 1
          volumeMounts:
            - name: ollama-models
              mountPath: /root/.ollama
          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: ollama-models
          persistentVolumeClaim:
            claimName: ollama-models
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: vorsyghta
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  storageClassName: huawei-evs-ssd

---
# Ollama Service
apiVersion: v1
kind: Service
metadata:
  name: ollama-service
  namespace: vorsyghta
spec:
  selector:
    app.kubernetes.io/name: ollama
  ports:
    - port: 11434
      targetPort: 11434
      name: http
  type: ClusterIP

---
# Vorsyghta API Service
apiVersion: v1
kind: Service
metadata:
  name: vorsyghta-api
  namespace: vorsyghta
  annotations:
    service.beta.kubernetes.io/huaweicloud-load-balancer-type: "elb"
    service.beta.kubernetes.io/huaweicloud-elb-protocol: "https"
spec:
  selector:
    app.kubernetes.io/name: vorsyghta
    app.kubernetes.io/component: api
  ports:
    - port: 443
      targetPort: 8000
      name: https
  type: LoadBalancer

---
# HorizontalPodAutoscaler for API
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vorsyghta-api-hpa
  namespace: vorsyghta
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vorsyghta-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
# NetworkPolicy - restrict egress for PCI-DSS compliance
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: vorsyghta-network-policy
  namespace: vorsyghta
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vorsyghta
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vorsyghta
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # Ollama service
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ollama
      ports:
        - protocol: TCP
          port: 11434
    # Payment processor APIs (configure specific IPs)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            exceptions:
              - 10.0.0.0/8
      ports:
        - protocol: TCP
          port: 443
    # Software update repositories
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443

---
# ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vorsyghta
  namespace: vorsyghta
  annotations:
    eks.amazonaws.com/role-arn: ""
---
# PodDisruptionBudget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vorsyghta-api-pdb
  namespace: vorsyghta
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vorsyghta
      app.kubernetes.io/component: api
