# ZestPayment Cloud Security Threat Simulation Configuration
# Target: Huawei Cloud CCE deployment with PCI-DSS compliance
# Domain: vorsyghta.com

# ============================================================
# Core Simulation Settings
# ============================================================
simulation:
  default_threat_type: "payment_fraud"
  max_concurrent_simulations: 5
  simulation_timeout: 1800
  audit_enabled: true
  audit_log_retention_days: 90
  pci_dss_mode: true
  data_residency: "ng"  # Nigeria - data sovereignty enforced
  redact_pii: true
  redact_pan: true  # Payment Account Number redaction

# ============================================================
# LLM Configuration - ZestPayment
# Four paths available; configure one based on deployment path
# ============================================================
llm:
  # Path A: Huawei ModelArts MaaS / Pangu LLM
  providers:
    - name: "huawei_modelarts"
      type: "openai_compatible"
      enabled: false
      api_base: "${HUAWEI_MODELARTS_ENDPOINT}"
      api_key: "${HUAWEI_MODELARTS_API_KEY}"
      model: "pangu-large"
      max_tokens: 4096
      temperature: 0.3
      timeout: 60
      priority: 1

    # Path B: Internal AI Gateway (LiteLLM/Portkey/vLLM)
    - name: "internal_gateway"
      type: "openai_compatible"
      enabled: false
      api_base: "${INTERNAL_GATEWAY_URL}"
      api_key: "${INTERNAL_GATEWAY_TOKEN}"
      model: "gpt-4"
      max_tokens: 4096
      temperature: 0.3
      timeout: 60
      priority: 1

    # Path C: Self-hosted Ollama (offline, GPU instance)
    - name: "ollama_local"
      type: "ollama"
      enabled: true
      base_url: "http://ollama-service:11434"
      model: "llama3:70b"
      max_tokens: 4096
      temperature: 0.3
      timeout: 120
      priority: 1
      gpu_required: true

    # Path D: External APIs (least likely for CBN entities)
    - name: "openai"
      type: "openai"
      enabled: false
      api_key: "${OPENAI_API_KEY}"
      model: "gpt-4-turbo"
      max_tokens: 4096
      temperature: 0.3
      timeout: 60
      priority: 2

    - name: "anthropic"
      type: "anthropic"
      enabled: false
      api_key: "${ANTHROPIC_API_KEY}"
      model: "claude-3-opus"
      max_tokens: 4096
      temperature: 0.3
      timeout: 60
      priority: 3

  fallback_chain:
    enabled: true
    max_retries: 3
    fallback_on_error: true

  # Payment-specific domain knowledge prompts
  domain_prompts:
    industry: "payment_processing"
    specialization: "african_payment_markets"
    knowledge_areas:
      - "Payment processing terminology"
      - "Financial transaction patterns"
      - "Mobile money and USSD protocols"
      - "eCommerce payment flows"
      - "QR code payment systems"
      - "PCI-DSS requirements"
      - "OWASP payment security guidelines"
      - "Financial industry security frameworks"
      - "Cloud security best practices"
      - "API security standards"
      - "Payment fraud patterns"
      - "Financial malware families"
      - "Social engineering tactics"
      - "API abuse techniques"
      - "Cloud attack methodologies"

# ============================================================
# Safety & Compliance
# ============================================================
safety:
  enabled: true
  strict_mode: true
  pci_dss_compliance: true
  ndpr_compliance: true
  prohibited_actions:
    - "Real payment processing"
    - "Actual fund transfers"
    - "Real customer data exposure"
    - "Production system disruption"
  require_approval_for: ["external_scan", "phishing_simulation", "api_abuse_test"]
  audit_all_actions: true
  data_classification: "confidential"
  encrypt_at_rest: true
  encrypt_in_transit: true

# ============================================================
# Logging & Observability
# ============================================================
logging:
  level: "INFO"
  format: "json"
  destinations:
    - type: "stdout"
      enabled: true
    - type: "file"
      enabled: true
      path: "/var/log/vorsyghta"
      rotation: "daily"
      retention_days: 90
    - type: "huawei_lts"
      enabled: true
      endpoint: "${HUAWEI_LTS_ENDPOINT}"
      log_group_id: "${HUAWEI_LTS_GROUP_ID}"
      log_stream_id: "${HUAWEI_LTS_STREAM_ID}"
    - type: "siem"
      enabled: false
      endpoint: "${SIEM_ENDPOINT}"
      format: "cef"

metrics:
  enabled: true
  endpoint: "/metrics"
  format: "prometheus"
  payment_specific_metrics:
    - "transaction_processing_rates"
    - "fraud_detection_alerts"
    - "api_response_times"
    - "payment_success_failure_rates"

# ============================================================
# API Configuration
# ============================================================
api:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  cors_origins:
    - "https://vorsyghta.com"
    - "https://www.vorsyghta.com"
  rate_limiting:
    enabled: true
    requests_per_minute: 100
  authentication:
    type: "jwt"
    secret_key: "${JWT_SECRET_KEY}"
    token_expiry: 3600

# ============================================================
# Email Delivery Integration
# ============================================================
email_delivery:
  # Option 1: Microsoft 365 (preferred)
  provider: "microsoft_365"
  microsoft_365:
    tenant_id: "${M365_TENANT_ID}"
    client_id: "${M365_CLIENT_ID}"
    client_secret: "${M365_CLIENT_SECRET}"
    scopes: ["https://graph.microsoft.com/.default"]
    mail_from: "admin@vorsyghta.com"
    permissions:
      - "Mail.Send"
      - "User.Read.All"

  # Option 2: SMTP Relay (alternative)
  smtp:
    enabled: false
    host: "${SMTP_HOST}"
    port: 587
    username: "${SMTP_USERNAME}"
    password: "${SMTP_PASSWORD}"
    use_tls: true

# ============================================================
# Directory Integration for Staff Targeting
# ============================================================
directory:
  # Option 1: Entra ID Graph API (preferred)
  provider: "entra_id"
  entra_id:
    tenant_id: "${M365_TENANT_ID}"
    client_id: "${M365_CLIENT_ID}"
    client_secret: "${M365_CLIENT_SECRET}"
    sync_interval_hours: 24
    filter_by_department: true
    payment_departments:
      - "Payment Operations"
      - "Risk & Compliance"
      - "Engineering"
      - "Customer Support"
      - "Finance"

  # Option 2: CSV Upload (alternative)
  csv:
    enabled: true
    upload_path: "/data/staff_directory.csv"
    format:
      - "email"
      - "name"
      - "department"
      - "role"
      - "payment_access_level"

  # Option 3: LDAP (alternative)
  ldap:
    enabled: false
    server: "${LDAP_SERVER}"
    bind_dn: "${LDAP_BIND_DN}"
    bind_password: "${LDAP_BIND_PASSWORD}"
    search_base: "${LDAP_SEARCH_BASE}"

# ============================================================
# Deployment Configuration
# ============================================================
deployment:
  platform: "huawei_cloud_cce"
  cluster_name: "vorsyghta-zestpayment"
  cluster_size: 2
  namespace: "vorsyghta"
  instance_specs:
    cpu: 4
    memory: "8Gi"
    os: "Ubuntu 22.04"
  gpu_requirements:
    needed: true
    gpu_type: "NVIDIA-T4"
    vram: "24Gi"
    purpose: "Local LLM hosting via Ollama"
  container_registry:
    type: "huawei_swr"
    endpoint: "${SWR_ENDPOINT}"
    namespace: "vorsyghta"
  storage:
    primary:
      type: "huawei_evs"
      capacity: "100Gi"
      mount_path: "/data"
    dataset:
      type: "huawei_sfs_turbo"
      capacity: "50Gi"
      mount_path: "/datasets"
    logs:
      type: "huawei_obs"
      bucket: "vorsyghta-logs"
      retention_days: 90
  load_balancer:
    type: "huawei_elb"
    listener_port: 443
    backend_port: 8000
    health_check: true
    ssl_termination: true
  waf:
    enabled: true
    provider: "huawei_waf"

# ============================================================
# Secrets Management
# ============================================================
secrets:
  # Preferred: Huawei DEW/KMS
  provider: "huawei_dew"
  huawei_dew:
    kms_key_id: "${DEW_KMS_KEY_ID}"
    region: "ng-west-1"
  stored_secrets:
    - name: "llm-api-keys"
      keys: ["OPENAI_API_KEY", "ANTHROPIC_API_KEY", "HUAWEI_MODELARTS_API_KEY"]
    - name: "payment-processor-keys"
      keys: ["PAYMENT_PROCESSOR_API_KEY"]
    - name: "database-credentials"
      keys: ["DB_HOST", "DB_USER", "DB_PASSWORD"]
    - name: "integration-tokens"
      keys: ["M365_CLIENT_SECRET", "JWT_SECRET_KEY"]
    - name: "email-credentials"
      keys: ["SMTP_PASSWORD"]

# ============================================================
# SSL/TLS & DNS
# ============================================================
ssl:
  domain: "vorsyghta.com"
  alternate_domains:
    - "www.vorsyghta.com"
  certificate_source: "company_pki"
  termination: "elb"
  auto_renewal: true
  pci_dss_compliant: true

dns:
  records:
    - type: "A"
      name: "vorsyghta.com"
      target: "elb_ip_address"
    - type: "CNAME"
      name: "www.vorsyghta.com"
      target: "vorsyghta.com"
    - type: "MX"
      name: "vorsyghta.com"
      target: "vorsyghta-com.mail.protection.outlook.com"

# ============================================================
# Quantum Threat Simulation (ZestPayment-specific)
# ============================================================
quantum:
  enabled: true
  scanner:
    scan_timeout_seconds: 60
    scan_tls_endpoints: true
    scan_ssh_keys: true
    scan_payment_api_crypto: true
  analyzer:
    y2q_estimate: 2030
    conservative_y2q: 2035
  planner:
    current_year: 2026
    y2q_estimate: 2030
    migrations_per_year: 8
    pci_dss_priority: true
  validator:
    oqs_provider_path: "liboqs-provider"
    openssl_path: "openssl"
  timeline:
    current_year: 2026
    y2q_estimate: 2030
    conservative_y2q: 2035
    optimistic_y2q: 2028

# ============================================================
# Defense Team Configuration
# ============================================================
defense:
  blue_team:
    enabled: true
    siem_integration:
      type: "huawei_lts"
      endpoint: "${HUAWEI_LTS_ENDPOINT}"
    incident_response:
      framework: "nist_800_61"
      pci_dss_requirements: true
      payment_specific_playbooks: true
    alert_triage:
      payment_alerts: true
      fraud_detection_integration: true
  purple_team:
    enabled: true
    correlation:
      red_blue_alignment: true
      payment_threat_correlation: true
