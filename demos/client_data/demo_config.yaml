# Demo configuration for Vorsyghta client-data feature.
# This config uses a local HTTP server (started by run_demo.sh) so no API keys are needed.

llm:
  default_provider: "ollama"
  ollama:
    enabled: true
    base_url: "http://localhost:11434"
    model: "llama3.2"
    timeout_seconds: 120
    max_tokens: 1000
    temperature: 0.7

client_data:
  enabled: true
  storage_path: "./demos/client_data/.cache"
  default_secret_provider: "env"
  tenants:
    - tenant_id: "acme-demo"
      name: "Acme Corp Demo"
      sources:
        - name: "acme_people_api"
          type: "api"
          enabled: true
          settings:
            protocol: "rest"
            base_url: "http://localhost:8765"
            endpoint: "/demo_client_api.json"
            auth_type: "none"
            mapping:
              employees:
                root: "data"
                id: "id"
                email: "email"
                name: "name"
                role: "title"
                department: "department"
        - name: "acme_network"
          type: "gns3"
          enabled: true
          settings:
            project_path: "./demos/client_data/demo_network.gns3"
